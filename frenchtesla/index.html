<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learn French Verbs!</title>
<style>
    :root {
        --regular: #CDEAC0;    /* regular verbs   */
        --irregular: #FFB4A2;  /* irregular verbs */
    }

    body {
        background-color: #FCF0DA;
        margin: 0 15px 0 20px;
        padding-bottom: 30px;
        font-family: Arial, sans-serif;
    }

    body::before, body::after {
        content: "";
        position: fixed;
        top: 0;
        width: 15px;
        height: 100%;
        background-color: #400000;
        z-index: 3;
    }
    body::before { left: 0; }
    body::after  { right: 0; }

    .legend {
        position: sticky;
        top: 0;
        z-index: 2;
        background-color: #FCF0DA;
        padding: 10px 5px;
        margin-bottom: 8px;
        border-bottom: 1px solid #e3cfa5;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        font-size: 0.9em;
        color: #400000;
    }

    .legend button {
        font: inherit;
        font-weight: 700;
        color: #1b2a41;
        padding: 6px 12px;
        border: 1px solid #ccc;
        border-radius: 10px;
        cursor: pointer;
    }
    .legend button.regular   { background-color: var(--regular); }
    .legend button.irregular { background-color: var(--irregular); }
    .legend button.off       { opacity: 0.35; }
    .legend button.tool      { background-color: #F9E4BD; color: #400000; }
    .legend button[hidden]   { display: none; }
    .legend button:focus-visible,
    .word-container:focus-visible { outline: 3px solid #400000; outline-offset: 2px; }
    .legend .hint { margin-left: auto; font-style: italic; }

    .word-container {
        display: inline-block;
        vertical-align: top;
        width: 150px;
        text-align: center;
        margin: 5px;
        margin-bottom: 20px;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        cursor: pointer;
    }
    .word-container.regular   { background-color: var(--regular); }
    .word-container.irregular { background-color: var(--irregular); }
    .word-container:hover     { filter: brightness(0.92); }
    .word-container.speaking  { box-shadow: 0 0 0 3px #400000; }
    .word-container.hidden    { display: none; }

    .french-word {
        font-size: 1.2em;
        font-weight: 700;
        color: #1b2a41;
        display: block;
        word-wrap: break-word;
    }

    .translation {
        font-style: italic;
        font-size: 0.9em;
        display: block;
        color: #3a3f58;
        word-wrap: break-word;
    }
</style>
</head>
<body>

<div class="legend">
    <button type="button" class="regular" data-type="regular" aria-pressed="true"></button>
    <button type="button" class="irregular" data-type="irregular" aria-pressed="true"></button>
    <button type="button" class="tool" id="shuffle">&#x1F500; Shuffle</button>
    <button type="button" class="tool" id="restore" hidden>&#x21A9; Original order</button>
    <span class="hint">Click a verb to hear it &middot; click a colour to hide/show that group</span>
</div>

<div id="grid"></div>

    const parse = block => block.trim().split("\n").map(line => {
        const [word, translation, t] = line.split("|");
        return { word, translation, type: t === "i" ? "irregular" : "regular" };
    });
    const sortKey = w => w.replace(/^(se |s'(en |y )?)/, "");
    const [starter, rest] = data.split("---").map(parse);
    rest.sort((a, b) => sortKey(a.word).localeCompare(sortKey(b.word), "fr"));
    const verbs = starter.concat(rest);

    // --- speech -----------------------------------------------------------
    const synth = window.speechSynthesis;
    let voices = [];
    function loadVoices() { voices = synth ? synth.getVoices() : []; }
    if (synth) { synth.onvoiceschanged = loadVoices; loadVoices(); }

    function speak(word, tile) {
        if (!synth) return;
        synth.cancel();
        const u = new SpeechSynthesisUtterance(word);
        u.lang = "fr-FR";
        u.rate = 0.85;
        const voice = voices.find(v => v.lang === "fr-FR") ||
                      voices.find(v => v.lang && v.lang.toLowerCase().startsWith("fr"));
        if (voice) u.voice = voice;
        tile.classList.add("speaking");
        u.onend = u.onerror = () => tile.classList.remove("speaking");
        synth.speak(u);
    }

    // --- tiles ------------------------------------------------------------
    const grid = document.getElementById("grid");
    const counts = { regular: 0, irregular: 0 };

    verbs.forEach(v => {
        counts[v.type]++;
        const tile = document.createElement("div");
        tile.className = "word-container " + v.type;
        tile.tabIndex = 0;
        tile.setAttribute("role", "button");
        tile.title = v.type + " verb";

        const w = document.createElement("span");
        w.className = "french-word";
        w.lang = "fr";
        w.textContent = v.word;

        const t = document.createElement("span");
        t.className = "translation";
        t.textContent = v.translation;

        tile.append(w, t);
        tile.addEventListener("click", () => speak(v.word, tile));
        tile.addEventListener("keydown", e => {
            if (e.key === "Enter" || e.key === " ") { e.preventDefault(); speak(v.word, tile); }
        });
        grid.appendChild(tile);
    });

    // --- shuffle ----------------------------------------------------------
    // The default order is kept in `original` and never modified; shuffling
    // only re-appends the same tile elements in a different sequence, so the
    // default page is always one click away and filters/listeners survive.
    const original = Array.from(grid.children);
    const shuffleBtn = document.getElementById("shuffle");
    const restoreBtn = document.getElementById("restore");

    function arrange(tiles) {
        const frag = document.createDocumentFragment();
        tiles.forEach(t => frag.appendChild(t));
        grid.appendChild(frag);
        window.scrollTo({ top: 0 });
    }

    shuffleBtn.addEventListener("click", () => {
        const deck = original.slice();
        for (let i = deck.length - 1; i > 0; i--) {          // Fisher–Yates
            const j = Math.floor(Math.random() * (i + 1));
            [deck[i], deck[j]] = [deck[j], deck[i]];
        }
        arrange(deck);
        restoreBtn.hidden = false;
    });

    restoreBtn.addEventListener("click", () => {
        arrange(original);
        restoreBtn.hidden = true;
    });

    // --- legend / filter --------------------------------------------------
    const css = getComputedStyle(document.documentElement);
    document.querySelectorAll(".legend button[data-type]").forEach(btn => {
        const type = btn.dataset.type;
        const hex = css.getPropertyValue("--" + type).trim();
        btn.textContent = `${type[0].toUpperCase() + type.slice(1)} (${counts[type]}) · ${hex}`;
        btn.addEventListener("click", () => {
            const off = btn.classList.toggle("off");
            btn.setAttribute("aria-pressed", String(!off));
            grid.querySelectorAll("." + type).forEach(el => el.classList.toggle("hidden", off));
        });
    });
});
